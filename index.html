<style>
:root{
  --red:#c92532; --red2:#8f1824; --coral:#ef6a72; --soft:#fff3f3; --cream:#fffafa;
  --ink:#17212b; --blue:#244d78; --line:#e7b5ba; --correct:#e1f6e8; --correct-b:#3d9d65;
  --wrong:#ffe2e4; --wrong-b:#d95d68; --shadow:0 12px 28px rgba(128,30,42,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Nunito","Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 8%,rgba(255,206,210,.45) 0 6%,transparent 18%),
    radial-gradient(circle at 88% 14%,rgba(255,226,226,.7) 0 7%,transparent 20%),

}
button,input{font:inherit}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float{position:absolute;font-size:30px;opacity:.23;filter:drop-shadow(0 4px 8px rgba(155,30,45,.15));animation:drift 30s linear infinite;white-space:nowrap}
.float.rev{animation-name:driftRev}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
@keyframes driftRev{from{transform:translateX(115vw) scaleX(-1)}to{transform:translateX(-15vw) scaleX(-1)}}
.bubble{position:absolute;border:1.5px solid rgba(201,37,50,.16);border-radius:50%;background:rgba(255,255,255,.42);animation:rise 15s linear infinite}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
.shell{position:relative;z-index:2;max-width:1500px;margin:auto;padding:14px}
header{
  background:linear-gradient(135deg,#ffffffef,#fff1f1ef,#fffdfdef);
  border:1px solid #e6b0b6;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr;gap:10px;align-items:center;text-align:center;
}
header h1{margin:0;color:var(--red2);font-size:clamp(22px,3vw,28px);letter-spacing:.4px;text-align:center}
header h2{margin:2px 0 0;font-size:clamp(17px,2.2vw,21px);color:#2b3e50}
.meta{font-size:13px;line-height:1.55;color:#6e565a;text-align:center}
.header-actions{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{border:1px solid #e3a8af;background:#fff;border-radius:999px;padding:8px 12px;color:#8b2130;font-weight:900;cursor:pointer}
.pill:hover{background:#fff0f1}
.identity{margin:12px 0;background:#ffffffea;border:1px solid #e8bcc1;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}
.identity label{font-size:12px;font-weight:900;color:#765b60;display:block;margin-bottom:4px}
.identity input,.vocab-input{width:100%;border:1px solid #dfbfc3;border-radius:10px;padding:9px 10px;background:#fff;outline:none;color:#1d2731}
.identity input:focus,.vocab-input:focus{border-color:#ce5260;box-shadow:0 0 0 3px rgba(206,82,96,.13)}
.stats{position:sticky;top:6px;z-index:12;background:linear-gradient(90deg,#9e1f2d,#ca3442,#a52633);color:#fff;border-radius:15px;padding:10px 12px;box-shadow:0 8px 24px rgba(99,16,27,.22);display:grid;grid-template-columns:repeat(6,minmax(80px,1fr));gap:8px;margin:10px 0;backdrop-filter:blur(8px)}
.stat{text-align:center;font-size:11px} .stat b{display:block;font-size:17px}
.progressbar{grid-column:1/-1;height:7px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden} .progressbar i{display:block;height:100%;width:0;background:#ffd6d9;border-radius:999px;transition:width .3s}
.tabs{display:flex;gap:7px;overflow:auto;padding:3px 1px 10px}
.tab{border:1px solid #e0aab1;background:#ffffffea;color:#8b2733;border-radius:999px;padding:8px 12px;font-weight:900;white-space:nowrap;cursor:pointer}
.tab.active{background:linear-gradient(90deg,#a91f2c,#d34652);color:#fff;border-color:transparent}
.section{display:none} .section.active{display:block}
.split{display:grid;grid-template-columns:minmax(420px,48%) 1fr;gap:14px;align-items:start}
.passage{position:sticky;top:110px;max-height:calc(100vh - 125px);overflow:auto;background:#fff;border:1px solid #ddb9bd;border-radius:18px;padding:18px;box-shadow:var(--shadow);line-height:1.62;color:#111}
.passage h2{text-align:center;font-family:Georgia,serif;font-size:20px;margin:4px 0 8px;color:#7d1d29}
.passage h3{font-family:Georgia,serif;margin:9px 0 3px;color:#7d1d29}
.passage p,.passage li{font-family:Georgia,"Times New Roman",serif;font-size:17px;color:#111}
.source-note{text-align:right;font-size:14px!important;color:#334!important}
.paper-instruction{font-family:Georgia,"Times New Roman",serif;font-weight:700;background:linear-gradient(90deg,#861c27,#b32735);color:#fff;margin:-18px -18px 15px;padding:12px 15px;border-radius:17px 17px 0 0;line-height:1.3}
.questions{display:flex;flex-direction:column;gap:12px}
.qcard{background:#ffffffed;border:1px solid #e2b8bd;border-radius:18px;padding:16px;box-shadow:var(--shadow);scroll-margin-top:115px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.qnum{font-weight:900;color:#7e1d28;font-size:17px;line-height:1.42}
.qbadge{font-size:11px;background:#fff0f1;color:#8c2531;padding:5px 8px;border-radius:999px;white-space:nowrap}
.options{display:grid;gap:8px}
.option{width:100%;text-align:left;border:1px solid #e4c1c5;background:#fffafa;border-radius:13px;padding:11px 12px;cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start;color:#1c2731;line-height:1.42}
.option:hover:not(:disabled){transform:translateY(-1px);border-color:#cf6974;box-shadow:0 6px 14px rgba(173,46,60,.10)}
.option:focus-visible{outline:3px solid #d96c77;outline-offset:2px}
.option .letter{font-weight:900;color:#c02e3b;min-width:22px}
.option.correct{background:var(--correct);border-color:var(--correct-b)} .option.correct .letter{color:#247548}
.option.wrong{background:var(--wrong);border-color:var(--wrong-b)} .option.wrong .letter{color:#a9323e}
.option.strike .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.62}
.state-tag{margin-left:auto;font-size:11px;font-weight:900}
.feedback{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:900}
.feedback.good{display:block;background:var(--correct);color:#176d41}
.feedback.bad{display:block;background:var(--wrong);color:#a0343f}
.explain{display:none;margin-top:10px;background:linear-gradient(135deg,#fff7f7,#fffdfd,#fff3f3);border:1px solid #e6c2c6;border-radius:14px;padding:13px;line-height:1.5;color:#202a33}
.explain.open{display:block}
.explain h4{margin:0 0 9px;color:#861e2a}
.ex-step{background:#fff;border-radius:10px;padding:9px 10px;margin:7px 0;border:1px solid #f2dfe1} .ex-step ul{margin:6px 0;padding-left:20px} .ex-step li{margin:5px 0}
.answer-line{margin-top:9px;background:#e3f7ea;border-left:4px solid #3da168;padding:9px 10px;border-radius:8px;font-weight:900;color:#1c7046}
.qactions{display:none;gap:8px;flex-wrap:wrap;margin-top:10px} .qactions.show{display:flex}
.smallbtn{border:1px solid #dfadb3;background:#fff;color:#8b2531;border-radius:10px;padding:8px 10px;font-weight:900;cursor:pointer}
.smallbtn.primary{background:linear-gradient(90deg,#a8202d,#d34551);color:#fff;border-color:transparent}
.vocab{background:#fff;border:1px solid #e0b3b9;border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.vocab h3{margin:0 0 5px;color:#8b1f2b} .vocab .hint{font-size:12px;color:#7b686b;margin-bottom:10px}
.vgrid{display:grid;grid-template-columns:1fr 1.25fr;border:1px solid #e3c3c7;border-radius:12px;overflow:hidden}
.vrow{display:contents} .vcell{padding:8px 10px;border-bottom:1px solid #f0dfe1;background:#fffafa} .vcell:nth-child(2n){border-left:1px solid #f0dfe1;background:#fff}
.vword{font-weight:900} .pos{font-size:11px;color:#8b777a}
.arr-layout{display:grid;grid-template-columns:280px 1fr;gap:14px}
.arr-guide{position:sticky;top:110px;background:linear-gradient(150deg,#fff,#fff1f2,#fff);border:1px solid #e2b5ba;border-radius:18px;padding:16px;box-shadow:var(--shadow);line-height:1.5}
.arr-guide h3{margin-top:0;color:#8c202c}
.arrange-bank{background:#fff;border:1px solid #ead0d3;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.arrange-bank p{font-family:Georgia,"Times New Roman",serif;margin:6px 0;line-height:1.45;color:#111}
.insert-sentence{display:block;margin:7px 0;padding:9px;background:#fff0f1;border-radius:9px;font-family:Georgia,serif;color:#111}
.footer-tools{margin:18px 0 8px;background:#ffffffea;border:1px solid #e2b8bd;border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.submitbox{display:none;margin-top:12px;background:linear-gradient(135deg,#fff,#fff2f3,#fff);border:1px solid #dfb7bc;border-radius:16px;padding:16px;text-align:center}
.submitbox.show{display:block}
.scorebig{font-size:30px;font-weight:900;color:#9c2230}
.note{font-size:12px;color:#79676a}
.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.confetti{position:fixed;width:9px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:confetti .9s ease-out forwards}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
@media(max-width:900px){.split,.arr-layout{grid-template-columns:1fr}.passage,.arr-guide{position:relative;top:auto;max-height:none}.stats{grid-template-columns:repeat(3,1fr)}.identity{grid-template-columns:1fr 1fr}.identity>button{grid-column:1/-1}}
@media(max-width:560px){.shell{padding:8px}.stats{font-size:10px}.stat b{font-size:14px}.qcard{padding:12px}.passage p{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.bg{display:none}}
@media print{body{background:#fff;color:#000}.bg,.header-actions,.stats,.tabs,.qactions,.footer-tools,.identity button{display:none!important}.shell{max-width:none;padding:0}header,.identity,.qcard,.passage,.vocab,.arr-guide{box-shadow:none;border:1px solid #aaa;background:#fff}.section{display:block!important}.split,.arr-layout{display:block}.passage{position:relative;max-height:none;margin-bottom:10px}.qcard{break-inside:avoid}.explain{background:#fff}}
</style>

const QUESTIONS=[{"n":1,"section":1,"stem":"Question 1:","options":{"A":"on","B":"by","C":"for","D":"at"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>on</b>: dùng trong collocation <i>have an impact on</i> = có ảnh hưởng đến.</li><li><b>B.</b> <b>by</b>: bởi/bằng; không dùng với <i>impact</i> ở cấu trúc này.</li><li><b>C.</b> <b>for</b>: cho/vì; sai collocation.</li><li><b>D.</b> <b>at</b>: tại/ở; sai collocation.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Vì những vấn đề này có ảnh hưởng nghiêm trọng đến đời sống hằng ngày...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm cố định là <b>have an impact on + N</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A là giới từ duy nhất tạo collocation đúng.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Không nói <i>impact by daily life</i>.</li><li><b>C.</b> Không nói <i>impact for daily life</i>.</li><li><b>D.</b> Không nói <i>impact at daily life</i>.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Ghi nhớ: <b>impact on</b> = ảnh hưởng đến.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. on</div>"},{"n":2,"section":1,"stem":"Question 2:","options":{"A":"launching","B":"to launch","C":"launched","D":"launch"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>launching</b>: V-ing chủ động, khiến campaign trở thành chủ thể đang phát động.</li><li><b>B.</b> <b>to launch</b>: to-infinitive, không phù hợp.</li><li><b>C.</b> <b>launched</b>: V3/ed rút gọn mệnh đề bị động: <i>a campaign which was launched by...</i>.</li><li><b>D.</b> <b>launch</b>: nguyên mẫu/danh từ; không tạo cấu trúc đúng.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Những người ủng hộ trách nhiệm cá nhân chỉ ra một chiến dịch được các học sinh địa phương phát động...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Có cụm <b>by local students</b> → dấu hiệu bị động.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p><b>launched</b> = được phát động, đúng dạng rút gọn bị động.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Mang nghĩa chủ động.</li><li><b>B.</b> Không phải cấu trúc mục đích.</li><li><b>D.</b> Thiếu bị động.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Rút gọn mệnh đề quan hệ bị động: <b>N + V3/ed</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. launched</div>"},{"n":3,"section":1,"stem":"Question 3:","options":{"A":"look into","B":"cut down on","C":"give out","D":"set up"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>look into</b>: điều tra/xem xét.</li><li><b>B.</b> <b>cut down on</b>: cắt giảm.</li><li><b>C.</b> <b>give out</b>: phát/phân phát; cạn kiệt.</li><li><b>D.</b> <b>set up</b>: thiết lập.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Họ tin rằng những lựa chọn nhỏ hằng ngày có thể cắt giảm việc sử dụng nhựa khi nhiều người cùng tham gia.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Tân ngữ là <b>plastic use</b>; ý cần là giảm mức sử dụng.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>cut down on plastic use</b> đúng cả nghĩa và collocation.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không phải ‘điều tra việc dùng nhựa’.</li><li><b>C.</b> Không phù hợp nghĩa.</li><li><b>D.</b> Không thể ‘thiết lập việc dùng nhựa’.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Phrasal verb: <b>cut down on + N</b> = giảm bớt.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. cut down on</div>"},{"n":4,"section":1,"stem":"Question 4:","options":{"A":"can","B":"must","C":"may","D":"might"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>can</b>: có thể/khả năng.</li><li><b>B.</b> <b>must</b>: phải, thể hiện nghĩa vụ/đòi hỏi mạnh.</li><li><b>C.</b> <b>may</b>: có thể, khả năng tương đối.</li><li><b>D.</b> <b>might</b>: có thể, khả năng yếu hơn.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Trong khi đó, những người khác cho rằng chính phủ phải đầu tư nhiều hơn vào giao thông công cộng bền vững...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Câu trước nói <b>governments must do more</b>; câu này tiếp tục quan điểm yêu cầu hành động mạnh từ chính phủ.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>must</b> phù hợp với sắc thái nghĩa vụ/chính sách cần thực hiện.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Chỉ khả năng, yếu nghĩa.</li><li><b>C.</b> Chỉ khả năng.</li><li><b>D.</b> Càng mang tính khả năng, không phải yêu cầu.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Modal <b>must</b> = nghĩa vụ/điều cần thiết.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. must</div>"},{"n":5,"section":1,"stem":"Question 5:","options":{"A":"adoption","B":"adopt","C":"adopted","D":"adopting"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>adoption</b> (n): sự tiếp nhận/áp dụng.</li><li><b>B.</b> <b>adopt</b> (v): áp dụng.</li><li><b>C.</b> <b>adopted</b> (adj/V3): được áp dụng.</li><li><b>D.</b> <b>adopting</b> (V-ing): việc đang áp dụng; không tự nhiên sau <i>the</i> trong cụm này bằng danh từ.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Các chiến dịch công chúng có thể khuyến khích việc áp dụng những thói quen xanh hơn trong cộng đồng.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Sau <b>the</b> và trước <b>of greener habits</b> cần danh từ.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p><b>the adoption of greener habits</b> là collocation chuẩn.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Động từ.</li><li><b>C.</b> Không phải danh từ trung tâm.</li><li><b>D.</b> Gerund có thể là danh từ nhưng cụm <i>the adopting of</i> không tự nhiên ở đây.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Word family: adopt (v) → <b>adoption</b> (n).</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. adoption</div>"},{"n":6,"section":1,"stem":"Question 6:","options":{"A":"Most","B":"Most of","C":"Almost","D":"Mostly"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>Most + plural noun</b>: hầu hết; nhưng ở đây có <i>the experts</i>.</li><li><b>B.</b> <b>Most of + the + plural noun</b>: hầu hết những...</li><li><b>C.</b> <b>Almost</b>: gần như; cần đi với <i>all</i> hoặc cấu trúc khác.</li><li><b>D.</b> <b>Mostly</b>: chủ yếu, trạng từ.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Hầu hết các chuyên gia đồng ý rằng cả cá nhân và chính phủ cần phối hợp.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Sau chỗ trống là <b>the experts</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>Cấu trúc đúng là <b>most of the experts</b>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Phải là <i>most experts</i>, không có <i>the</i>.</li><li><b>C.</b> Không nói <i>almost the experts</i>.</li><li><b>D.</b> Trạng từ không phù hợp.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Phân biệt: <b>most people</b> nhưng <b>most of the people</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. Most of</div>"},{"n":7,"section":2,"stem":"Question 7:","options":{"A":"repair","B":"storage","C":"treatment","D":"testing"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>repair facilities</b>: cơ sở sửa chữa; không phù hợp với việc loại bỏ bộ phận nguy hại.</li><li><b>B.</b> <b>storage facilities</b>: cơ sở lưu trữ.</li><li><b>C.</b> <b>waste treatment facilities</b>: cơ sở xử lý chất thải.</li><li><b>D.</b> <b>testing facilities</b>: cơ sở kiểm tra/thử nghiệm.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Thiết bị cũ có thể thải hóa chất độc hại trừ khi được đưa tới các cơ sở xử lý chất thải phù hợp...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm <b>where unsafe parts are removed</b> mô tả hoạt động xử lý chất thải.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p><b>waste treatment facilities</b> là cụm phù hợp nhất.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Chỉ sửa chữa.</li><li><b>B.</b> Chỉ lưu trữ.</li><li><b>D.</b> Chỉ kiểm tra.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Collocation: <b>waste treatment facility</b> = cơ sở xử lý chất thải.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. treatment</div>"},{"n":8,"section":2,"stem":"Question 8:","options":{"A":"take back","B":"set aside","C":"hand over","D":"sort out"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>take back</b>: nhận lại/đưa trả.</li><li><b>B.</b> <b>set aside</b>: để riêng/dành ra.</li><li><b>C.</b> <b>hand over</b>: giao nộp.</li><li><b>D.</b> <b>sort out</b>: phân loại/sắp xếp, xử lý.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Tình nguyện viên giúp phân loại các thiết bị đã qua sử dụng trước khi chúng được sửa, tái sử dụng hoặc tái chế.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Sau đó các thiết bị sẽ đi theo các hướng khác nhau; bước trước là phân loại.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p><b>sort out used devices</b> phù hợp ngữ cảnh recycling centre.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không nhấn mạnh phân loại.</li><li><b>B.</b> Chỉ để riêng, chưa đủ nghĩa.</li><li><b>C.</b> Là giao cho người khác.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>sort out</b> có thể nghĩa là phân loại/xử lý cho rõ ràng.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. sort out</div>"},{"n":9,"section":2,"stem":"Question 9:","options":{"A":"However","B":"Therefore","C":"Meanwhile","D":"For example"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>However</b>: tuy nhiên, tạo tương phản.</li><li><b>B.</b> <b>Therefore</b>: vì vậy, kết quả.</li><li><b>C.</b> <b>Meanwhile</b>: trong khi đó/đồng thời.</li><li><b>D.</b> <b>For example</b>: ví dụ.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Tuy nhiên, lượng lớn rác điện tử vẫn bị vứt cùng rác sinh hoạt.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Các bullet trước nói về giải pháp tái chế tích cực; câu này chuyển sang thực tế tiêu cực.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p><b>However</b> tạo đối lập đúng.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Không phải kết quả của giải pháp trước.</li><li><b>C.</b> Không chỉ là hai việc song song.</li><li><b>D.</b> Không phải ví dụ minh họa cho giải pháp.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Linker <b>however</b> = tuy nhiên, dùng để chuyển ý đối lập.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. However</div>"},{"n":10,"section":2,"stem":"Question 10:","options":{"A":"as if","B":"like","C":"as though","D":"alike"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>as if</b>: như thể + mệnh đề.</li><li><b>B.</b> <b>like</b>: giống như + danh từ/cụm danh từ.</li><li><b>C.</b> <b>as though</b>: như thể + mệnh đề.</li><li><b>D.</b> <b>alike</b>: giống nhau, thường đứng sau động từ.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Một số người vẫn đối xử với đồ điện tử hỏng giống như rác sinh hoạt thông thường...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Sau chỗ trống là cụm danh từ <b>ordinary household rubbish</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>Dùng <b>like + noun</b>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Cần mệnh đề.</li><li><b>C.</b> Cần mệnh đề.</li><li><b>D.</b> Không đứng trước danh từ theo cách này.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>like + N</b>; <b>as if/as though + clause</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. like</div>"},{"n":11,"section":2,"stem":"Question 11:","options":{"A":"loss","B":"damage","C":"waste","D":"harm"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>loss</b>: sự mất mát.</li><li><b>B.</b> <b>damage</b>: thiệt hại.</li><li><b>C.</b> <b>waste</b>: rác thải/sự lãng phí; cụm <i>go to waste</i> = bị lãng phí.</li><li><b>D.</b> <b>harm</b>: tổn hại.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Nếu không tái chế đúng cách, các kim loại có giá trị có thể bị lãng phí thay vì được thu hồi.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm cố định <b>go to waste</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C hoàn thành idiom đúng.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không có cụm <i>go to loss</i>.</li><li><b>B.</b> Không có <i>go to damage</i>.</li><li><b>D.</b> Không có <i>go to harm</i> theo nghĩa này.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Idiom: <b>go to waste</b> = bị bỏ phí/lãng phí.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. waste</div>"},{"n":12,"section":2,"stem":"Question 12:","options":{"A":"several","B":"each","C":"many","D":"another"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>several</b>: vài; cần danh từ số nhiều sau.</li><li><b>B.</b> <b>each</b>: mỗi; dùng khi có hai hoặc nhiều lựa chọn được xét riêng từng cái.</li><li><b>C.</b> <b>many</b>: nhiều; cần danh từ số nhiều.</li><li><b>D.</b> <b>another</b>: một cái khác; không phù hợp vì đang nói hai lựa chọn đã nêu.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Khi học sinh được đưa ra hai cách xử lý thiết bị cũ — sửa hoặc quyên góp — mỗi lựa chọn đều có thể giúp giảm rác.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Có chính xác hai lựa chọn đã được nêu.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>each choice</b> = mỗi lựa chọn trong hai lựa chọn.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không thể <i>several choice</i>.</li><li><b>C.</b> Không thể <i>many choice</i>.</li><li><b>D.</b> Hàm ý một lựa chọn khác chưa nêu.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>each + singular noun</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. each</div>"},{"n":13,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Leo: Could we buy fruit from the market and ask everyone to bring a refillable bottle instead?</p>\n<p><b>b.</b> Nina: I want to prepare snacks for the club meeting, but most drinks come in plastic cups.</p>\n<p><b>c.</b> Nina: Good idea. It will cost less, and we will avoid a full bag of rubbish after the meeting.</p>\n</div>","options":{"A":"b – a – c","B":"c – a – b","C":"b – c – a","D":"a – b – c"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> b nêu vấn đề → a đề xuất giải pháp → c phản hồi ‘Good idea’ và nêu lợi ích.</li><li><b>B.</b> c mở bằng ‘Good idea’ khi chưa có ý tưởng nào.</li><li><b>C.</b> c khen ý tưởng trước khi a đưa ra.</li><li><b>D.</b> a đề xuất trước khi b nêu vấn đề plastic cups.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Nina nói đồ uống dùng cốc nhựa; Leo đề xuất mua hoa quả và mang bình cá nhân; Nina đồng ý.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p><i>Good idea</i> ở c phải theo sau một đề xuất; đề xuất a phản hồi trực tiếp vấn đề b.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A tạo đúng mạch hội thoại.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Thiếu tiền đề cho c.</li><li><b>C.</b> Đảo câu khen và đề xuất.</li><li><b>D.</b> Giải pháp trước vấn đề.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Hội thoại: <b>problem → suggestion → response</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. b – a – c</div>"},{"n":14,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Noah: Ask the canteen to donate refillable cups and add handmade seed cards.</p>\n<p><b>b.</b> Mia: Nice. Those gifts still feel special and match the message of the event.</p>\n<p><b>c.</b> Mia: Could the prizes be reusable items, like lunch boxes or cloth bags?</p>\n<p><b>d.</b> Noah: Then maybe avoid buying those gifts and look for things people can use again.</p>\n<p><b>e.</b> Mia: I’m choosing prizes for Green Week, but many gifts online are cheap plastic things.</p>\n</div>","options":{"A":"c – a – e – d – b","B":"e – a – b – d – c","C":"c – d – e – a – b","D":"e – d – c – a – b"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> c mở bằng câu hỏi nhưng chưa có bối cảnh; e vấn đề lại xuất hiện giữa hội thoại.</li><li><b>B.</b> a đưa ví dụ cụ thể quá sớm trước khi d nêu hướng tránh đồ nhựa; c bị đặt cuối.</li><li><b>C.</b> c trước e nên người đọc chưa biết Mia đang chọn prizes gì.</li><li><b>D.</b> e nêu vấn đề → d khuyên tránh đồ nhựa và dùng lại → c hỏi rõ reusable items → a đưa ví dụ → b phản hồi tích cực.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Mia đang chọn quà nhưng thấy nhiều đồ nhựa rẻ; Noah khuyên chọn đồ có thể dùng lại; Mia hỏi cụ thể, Noah gợi ý, Mia đồng ý.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Dấu hiệu <b>Then</b> ở d phản hồi trực tiếp vấn đề e; a trả lời câu hỏi c; b là kết luận.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D có mạch tự nhiên nhất.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Thiếu bối cảnh.</li><li><b>B.</b> Các lượt ý không phát triển tự nhiên.</li><li><b>C.</b> Đảo câu vấn đề và câu hỏi.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Theo dõi từ nối như <b>Then</b> và cặp câu hỏi–trả lời.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. e – d – c – a – b</div>"},{"n":15,"section":3,"stem":"<div class=\"arrange-bank\">\n<p>Dear Parents and Students,</p>\n<p><b>a.</b> These items will be checked by volunteers and placed on labelled tables before the fair opens.</p>\n<p><b>b.</b> Please help your child prepare the items at home and avoid sending broken toys or glass bottles.</p>\n<p><b>c.</b> Our class is planning a small “swap corner” during the school fair next Friday afternoon.</p>\n<p><b>d.</b> Instead of buying new products, children can choose one item and learn how reuse reduces waste.</p>\n<p><b>e.</b> Students can bring clean used books, pencil cases, or lunch boxes that they no longer need.</p>\n<p>Thank you for your support.<br>The Green Club</p>\n</div>","options":{"A":"e – a – c – d – b","B":"c – d – e – a – b","C":"c – a – e – d – b","D":"e – d – c – a – b"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> e xuất hiện trước câu c giới thiệu swap corner.</li><li><b>B.</b> c giới thiệu sự kiện → d nêu mục đích → e nêu đồ được mang → a giải thích xử lý đồ → b hướng dẫn phụ huynh chuẩn bị.</li><li><b>C.</b> a ‘These items’ đứng trước khi e giới thiệu items.</li><li><b>D.</b> Mở bằng items và reuse trước khi giới thiệu sự kiện.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Email thông báo góc đổi đồ: giới thiệu hoạt động, mục tiêu tái sử dụng, vật phẩm, cách kiểm tra và yêu cầu chuẩn bị.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p><i>These items</i> ở a phải theo sau e; câu c nên mở thông báo.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B đảm bảo quy chiếu và trình tự hợp lý.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Thiếu câu mở.</li><li><b>C.</b> Đại từ quy chiếu sai vị trí.</li><li><b>D.</b> Thiếu bối cảnh.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Trong email: <b>event → purpose → details → procedure → instruction</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. c – d – e – a – b</div>"},{"n":16,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Some students forgot on the second day, so the monitor placed a reminder note near the classroom door.</p>\n<p><b>b.</b> During exam week, our class noticed that the bin beside the canteen filled with plastic bottles before noon, especially after PE lessons.</p>\n<p><b>c.</b> By Friday, the bottle bin was only half full, and our class chose to keep the habit for club meetings too.</p>\n<p><b>d.</b> Several students thought recycling was enough, but the clean-up team suggested reducing the number of bottles first.</p>\n<p><b>e.</b> We decided to test a simple rule: bring refillable bottles for five school days and write our names on them.</p>\n</div>","options":{"A":"b – e – d – c – a","B":"d – b – e – a – c","C":"b – d – e – a – c","D":"a – b – d – c – e"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> d bị đặt sau khi e đã quyết định giải pháp; c kết quả lại trước a sự cố ngày thứ hai.</li><li><b>B.</b> d nêu phản ứng trước khi b giới thiệu vấn đề bottle bin.</li><li><b>C.</b> b vấn đề → d tranh luận/đề xuất giảm → e thử quy tắc → a sự cố ngày 2 → c kết quả thứ Sáu.</li><li><b>D.</b> a mở bằng ‘second day’ khi chưa có kế hoạch thử nghiệm.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Lớp phát hiện nhiều chai nhựa, thảo luận rằng nên giảm trước khi chỉ tái chế, thử quy tắc mang bình cá nhân, nhắc nhở, rồi thấy kết quả tốt.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Các mốc thời gian <b>During exam week → five school days → second day → By Friday</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C đúng cả nhân quả và thời gian.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai trình tự kết quả.</li><li><b>B.</b> Thiếu vấn đề trước phản ứng.</li><li><b>D.</b> Mốc ‘second day’ chưa có tiền đề.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Sắp xếp theo <b>problem → response → action → obstacle → result</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. b – d – e – a – c</div>"},{"n":17,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> A short report after the fair showed nearly the same income as before, while the rubbish bags behind the hall were much lighter, which surprised the teachers.</p>\n<p><b>b.</b> In response, the committee planned an event that stayed enjoyable, supported the library fund, and did not encourage careless shopping.</p>\n<p><b>c.</b> To put that aim into practice, each club prepared useful items, repaired small things, or offered experiences such as photo corners and board games.</p>\n<p><b>d.</b> The problem began at the previous fair near the gym, where many cheap plastic souvenirs were sold and then left in drawers after a week.</p>\n<p><b>e.</b> Some students still worried that visitors would spend less money, but the handmade soap and notebook-refill table attracted long lines near lunchtime.</p>\n</div>","options":{"A":"b – d – c – e – a","B":"d – b – c – e – a","C":"d – c – b – e – a","D":"c – d – b – e – a"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> b ‘In response’ xuất hiện trước khi d nêu vấn đề.</li><li><b>B.</b> d nêu vấn đề → b phản ứng bằng kế hoạch → c thực hiện mục tiêu → e nỗi lo nhưng phản hồi tích cực → a báo cáo kết quả cuối.</li><li><b>C.</b> c ‘that aim’ đứng trước b nêu aim.</li><li><b>D.</b> c mở bằng ‘that aim’ không có tiền đề.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Hội chợ trước tạo nhiều đồ nhựa rác; ban tổ chức lập kế hoạch mới, các câu lạc bộ thực hiện, học sinh lo doanh thu nhưng thực tế đông người, báo cáo cuối xác nhận kết quả tốt.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Các cụm <b>In response</b> và <b>that aim</b> đòi d → b → c; a là kết quả sau fair.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là chuỗi hoàn chỉnh.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Response trước problem.</li><li><b>C.</b> ‘that aim’ chưa có.</li><li><b>D.</b> Thiếu tiền đề.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Theo dõi reference words: <b>In response, that aim, after the fair</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. d – b – c – e – a</div>"},{"n":18,"section":4,"stem":"Question 18:","options":{"A":"although eco-friendly tours attract more attention from travellers","B":"whether it only appears eco-friendly in travel advertisements","C":"because it aims to raise awareness of natural resources","D":"how public transport is used instead of personal cars"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>although</b> cần tạo mệnh đề nhượng bộ, nhưng không song song với cấu trúc <i>whether...</i>.</li><li><b>B.</b> <b>whether...</b> tạo cặp song song: whether truly sustainable, or whether only appears eco-friendly.</li><li><b>C.</b> <b>because</b> đưa nguyên nhân, không phù hợp câu hỏi về tính thật/giả.</li><li><b>D.</b> <b>how</b> đổi hẳn trọng tâm.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Tuy nhiên, vẫn còn câu hỏi liệu một chuyến đi có thật sự bền vững hay chỉ có vẻ thân thiện với môi trường trong quảng cáo du lịch.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cấu trúc đã có <b>whether...</b> trước <i>or</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B tạo cấu trúc song song và đúng ý greenwashing trong tourism.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai quan hệ và song song.</li><li><b>C.</b> Sai logic.</li><li><b>D.</b> Sai loại câu hỏi.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Cấu trúc: <b>whether A or whether B</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. whether it only appears eco-friendly in travel advertisements</div>"},{"n":19,"section":4,"stem":"Question 19:","options":{"A":"to lead to more litter and damage to natural habitats","B":"which are led to more litter and damaged natural habitats","C":"leading to more litter and damage to natural habitats","D":"and lead to more litter and damage natural habitats"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>to lead</b> thường chỉ mục đích/kết quả có chủ ý, không phù hợp bằng V-ing.</li><li><b>B.</b> Sai bị động: visitors không ‘được dẫn đến’ litter.</li><li><b>C.</b> <b>leading to...</b> là cụm V-ing diễn tả kết quả của việc quá đông khách.</li><li><b>D.</b> Nếu dùng <i>and lead</i>, chủ ngữ gần nhất <i>beaches and paths</i> sẽ ‘lead’, sai nghĩa.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Một số bãi biển và đường núi đông nghịt du khách, dẫn đến nhiều rác hơn và gây hại môi trường sống tự nhiên.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Sau dấu phẩy cần cụm chỉ hệ quả của tình trạng đông khách.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p><b>leading to</b> đúng ngữ pháp và nghĩa.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không phải mục đích.</li><li><b>B.</b> Sai bị động.</li><li><b>D.</b> Sai chủ thể hành động.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>V-ing sau dấu phẩy có thể chỉ <b>result</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. leading to more litter and damage to natural habitats</div>"},{"n":20,"section":4,"stem":"Question 20:","options":{"A":"local people can cut down on all transport emissions at once","B":"eco-friendly materials are going to be used in every hotel","C":"public transport becomes less useful than personal cars","D":"public places and natural resources may be damaged over time"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Không có cơ sở rằng local people có thể xóa mọi emission ngay lập tức.</li><li><b>B.</b> Không liên quan trực tiếp điều kiện tour companies chạy theo giá rẻ/số lượng.</li><li><b>C.</b> Không được bài nói.</li><li><b>D.</b> Đúng: mass tourism theo giá rẻ/số lượng lớn có thể gây hại dần cho public places và resources.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Nếu các công ty du lịch chủ yếu tập trung vào giá rẻ và số lượng khách lớn, các không gian công cộng và tài nguyên thiên nhiên có thể bị tổn hại theo thời gian.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Câu sau tiếp tục nói natural resources bị overused.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D nối đúng logic tác hại của du lịch thiếu kiểm soát.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Tuyệt đối hóa sai.</li><li><b>B.</b> Không có quan hệ.</li><li><b>C.</b> Không có bằng chứng.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Điều kiện <b>If...</b> cần mệnh đề kết quả hợp logic với đoạn.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. public places and natural resources may be damaged over time</div>"},{"n":21,"section":4,"stem":"Question 21:","options":{"A":"will keep free from litter for local people and visitors","B":"will be kept clean and pleasant for local people and visitors","C":"are keeping public areas tidy during busy travel seasons","D":"have kept in better condition because visitors reduce waste"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Sai chủ động: public places không tự ‘keep free’.</li><li><b>B.</b> <b>will be kept</b>: bị động tương lai đúng; public places được giữ sạch đẹp nhờ thói quen của khách.</li><li><b>C.</b> Hiện tại tiếp diễn không phù hợp điều kiện <i>if they are practised...</i>.</li><li><b>D.</b> Present perfect và thiếu cấu trúc tự nhiên.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Nếu nhiều du khách cùng thực hiện những thói quen này, các địa điểm công cộng sẽ được giữ sạch sẽ và dễ chịu...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Chủ ngữ <b>public places</b> nhận tác động → cần bị động.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B đúng <b>will be + V3</b>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai voice.</li><li><b>C.</b> Sai tense/logic.</li><li><b>D.</b> Sai cấu trúc.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Bị động tương lai: <b>will be + V3</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. will be kept clean and pleasant for local people and visitors</div>"},{"n":22,"section":4,"stem":"Question 22:","options":{"A":"but it can also make visitors less aware of environmental protection","B":"so it automatically prevents all damage to natural resources","C":"and it can encourage visitors to protect public places during their trips","D":"or it can ask local people to clean up waste after tourists leave"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Trái với thông điệp sustainable tourism.</li><li><b>B.</b> Từ <i>automatically/all</i> quá tuyệt đối.</li><li><b>C.</b> Bổ sung lợi ích hợp lý: thu nhập địa phương và khuyến khích bảo vệ nơi công cộng.</li><li><b>D.</b> Đẩy trách nhiệm sang local people, trái đoạn kêu gọi travellers/businesses cùng chịu trách nhiệm.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Khi được lên kế hoạch cẩn thận, du lịch có thể tạo nguồn thu ổn định cho người dân địa phương và cũng có thể khuyến khích du khách bảo vệ các địa điểm công cộng...”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Vế trước là lợi ích; cần một lợi ích tích cực song song.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C đúng nghĩa và nối bằng <b>and</b> tự nhiên.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Mang tác động tiêu cực trái mạch.</li><li><b>B.</b> Tuyệt đối hóa.</li><li><b>D.</b> Sai thông điệp trách nhiệm.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Kết luận đoạn thường cân bằng lợi ích kinh tế và bảo vệ môi trường.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. and it can encourage visitors to protect public places during their trips</div>"},{"n":23,"section":5,"stem":"Question 23: In which paragraph does the writer suggest that city noise can seem positive but still create hidden pressure?","options":{"A":"Paragraph 1","B":"Paragraph 2","C":"Paragraph 3","D":"Paragraph 4"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: đoạn 1 nói noise là ‘sound of progress’, shopkeeper welcome busy road, student feels safer, nhưng <i>beneath this daily energy</i> có áp lực.</li><li><b>B.</b> Đoạn 2 nói tác hại sức khỏe và bất bình đẳng.</li><li><b>C.</b> Đoạn 3 nói xã hội đổ lỗi cá nhân.</li><li><b>D.</b> Đoạn 4 nói giải pháp cân bằng.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Đoạn nào cho thấy tiếng ồn thành phố có thể được xem tích cực nhưng vẫn tạo áp lực ẩn?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 1 vừa nêu mặt tích cực vừa chốt bằng <i>a pressure that many residents learn to carry</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A bao quát đúng hai vế câu hỏi.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. Paragraph 1</div>"},{"n":24,"section":5,"stem":"Question 24: The word “cough” in paragraph 1 is closest in meaning to ______.","options":{"A":"move heavily","B":"start unevenly","C":"make rough noises","D":"stop for a short time"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Không nói về chuyển động nặng nề.</li><li><b>B.</b> Có thể liên quan engine khởi động không đều nhưng ngữ cảnh nhấn mạnh âm thanh.</li><li><b>C.</b> Đúng: ẩn dụ ‘xe buýt ho’ = tạo tiếng động thô/khục khặc.</li><li><b>D.</b> Không phải dừng lại.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>cough</i> khi nói về xe buýt gần nghĩa nhất với gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>Buses cough at traffic lights</i> là personification mô tả tiếng máy xe khục khặc.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C giữ đúng sắc thái âm thanh.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. make rough noises</div>"},{"n":25,"section":5,"stem":"Question 25: The word “it” in paragraph 1 refers to ______.","options":{"A":"the city street","B":"the morning traffic","C":"the shop’s location","D":"the busy road"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Cụm gần nhất và đúng nghĩa không phải ‘city street’ chung chung.</li><li><b>B.</b> Morning traffic không phải danh từ ngay trước.</li><li><b>C.</b> Không có shop’s location.</li><li><b>D.</b> Đúng: <i>A shopkeeper may welcome the busy road because it brings customers.</i></li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>it</i> trong đoạn 1 thay cho gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đại từ nằm ngay sau cụm <b>the busy road</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D phù hợp số ít và nghĩa ‘con đường đông mang khách đến’.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. the busy road</div>"},{"n":26,"section":5,"stem":"Question 26: What can be inferred about people living near main roads, airports, markets, or building sites?","options":{"A":"They may have to live with harmful noise without having much control over it.","B":"They choose such places mainly because busy streets bring more customers.","C":"They become less affected once the sound of the city feels familiar.","D":"They experience the city in almost the same way as people in quieter areas."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: đoạn nói họ <i>may have little choice but to accept a soundtrack</i> đi theo vào bữa ăn, học tập và giấc ngủ.</li><li><b>B.</b> Chỉ shopkeeper là ví dụ riêng, không áp cho tất cả.</li><li><b>C.</b> Bài không nói quen rồi sẽ ít bị ảnh hưởng.</li><li><b>D.</b> Trái câu <i>people do not experience the city equally</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Có thể suy ra gì về người sống gần đường lớn, sân bay, chợ hoặc công trường?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 2 nhấn mạnh thiếu lựa chọn và tác hại kéo dài.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A paraphrase chính xác ‘little choice’.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. They may have to live with harmful noise without having much control over it.</div>"},{"n":27,"section":5,"stem":"Question 27: Which of the following best paraphrases the underlined sentence in paragraph 3?","options":{"A":"Cities should accept noise as a normal price of growth and expect residents to adjust.","B":"A city can respond fairly only when it treats noise as a common problem, not a private weakness.","C":"People should control their reactions before asking the city to change its noisy design.","D":"Noise becomes less harmful when individuals learn to ignore it in everyday life."},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Trái câu gốc vì tác giả phản đối việc coi noise là bình thường.</li><li><b>B.</b> Đúng: noise phải được hiểu là điều kiện chung thì thành phố mới ngừng đổ lỗi cho cá nhân.</li><li><b>C.</b> Đảo ngược trách nhiệm.</li><li><b>D.</b> Không nói học cách phớt lờ sẽ giảm hại.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào diễn đạt lại tốt nhất câu gạch chân ở đoạn 3?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu gốc đối lập <b>shared condition</b> với <b>blaming individuals</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B bảo toàn đúng quan hệ đó.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. A city can respond fairly only when it treats noise as a common problem, not a private weakness.</div>"},{"n":28,"section":5,"stem":"Question 28: The word “romanticised” in paragraph 4 is OPPOSITE in meaning to ______.","options":{"A":"celebrated unrealistically","B":"made more attractive","C":"discussed emotionally","D":"viewed realistically"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Gần nghĩa: lý tưởng hóa/ca ngợi thiếu thực tế.</li><li><b>B.</b> Cũng gần nghĩa làm hấp dẫn hơn.</li><li><b>C.</b> Khác trường nghĩa.</li><li><b>D.</b> Đúng: nhìn nhận thực tế là đối lập với lý tưởng hóa.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>romanticised</i> TRÁI NGHĨA với từ nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>silence should not be romanticised</i> = không nên lý tưởng hóa sự im lặng.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>Đối nghĩa trực tiếp là <b>viewed realistically</b>.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. viewed realistically</div>"},{"n":29,"section":5,"stem":"Question 29: Which of the following is NOT mentioned as a possible way to reduce the harm of city noise?","options":{"A":"Using quieter forms of transport.","B":"Improving rules for buildings.","C":"Shortening school hours near busy roads.","D":"Creating protected quiet areas."},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Có: <i>Quieter transport</i>.</li><li><b>B.</b> Có: <i>better building rules</i>.</li><li><b>C.</b> Không có chi tiết rút ngắn giờ học.</li><li><b>D.</b> Có: <i>protected quiet areas</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Ý nào KHÔNG được nêu như giải pháp giảm tác hại tiếng ồn?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 4 liệt kê trực tiếp A, B, D.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C là lựa chọn duy nhất không xuất hiện.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. Shortening school hours near busy roads.</div>"},{"n":30,"section":5,"stem":"Question 30: In which paragraph does the writer suggest that city sound should be controlled, not removed?","options":{"A":"Paragraph 1","B":"Paragraph 4","C":"Paragraph 2","D":"Paragraph 3"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đoạn 1 giới thiệu cảnh thành phố.</li><li><b>B.</b> Đúng: đoạn 4 nói <i>not how to make cities mute</i> mà làm chúng kinder; city needs movement, voices, trade.</li><li><b>C.</b> Đoạn 2 nói tác hại.</li><li><b>D.</b> Đoạn 3 nói trách nhiệm xã hội.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Đoạn nào cho rằng âm thanh thành phố nên được kiểm soát chứ không loại bỏ?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 4 khẳng định <i>A good city is not one without sound</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là đoạn nêu rõ kiểm soát/cân bằng thay vì xóa bỏ âm thanh.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. Paragraph 4</div>"},{"n":31,"section":6,"stem":"Question 31: Where in the passage does the following sentence best fit?<br><span class='insert-sentence'>Even so, a second life can ease pressure on raw materials, landfill space, and the habit of treating objects as brief entertainment.</span>","options":{"A":"[I]","B":"[II]","C":"[III]","D":"[IV]"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> [I] quá sớm: chưa có câu thừa nhận mặt hạn chế để <i>Even so</i> tạo tương phản.</li><li><b>B.</b> [II] sau ý reuse/repair tích cực, <i>Even so</i> không có điểm đối lập gần trước.</li><li><b>C.</b> Đúng: đứng sau <i>A shirt sold again is not harmless...</i>; ‘Even so’ chuyển từ hạn chế sang lợi ích của second life.</li><li><b>D.</b> Sau ý low prices, liên kết ‘Even so’ kém trực tiếp.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Câu này nên đặt ở vị trí nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu trước [III] thừa nhận second hand không hoàn toàn vô hại; câu chèn nói “dù vậy” second life vẫn giảm áp lực.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C tạo quan hệ nhượng bộ chính xác nhất.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. [III]</div>"},{"n":32,"section":6,"stem":"Question 32: The phrase “spared from the tidy ending” in paragraph 1 is closest in meaning to ______.","options":{"A":"protected from rough handling","B":"saved from being treated as finished","C":"prepared for orderly resale","D":"hidden from public view"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Không nói tránh bị xử lý thô.</li><li><b>B.</b> Đúng: đồ vật cũ không bị coi là đã ‘kết thúc vòng đời’, mà được trao second life.</li><li><b>C.</b> Không chỉ là chuẩn bị bán lại.</li><li><b>D.</b> Ngược lại, chúng đang được bày công khai.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Cụm <i>spared from the tidy ending</i> gần nghĩa nhất với gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Ngữ cảnh nói old things thường có ‘ending’ nhưng ở second hand market chúng tiếp tục được sử dụng.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B diễn đạt đúng ý ‘saved from being treated as finished’.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. saved from being treated as finished</div>"},{"n":33,"section":6,"stem":"Question 33: Which of the following is NOT true according to paragraph 2?","options":{"A":"A resold shirt is presented as harmless once it receives a second life.","B":"Reuse and repair can keep clothing valuable for longer.","C":"Fast trends can turn yesterday’s style into tomorrow’s rubbish.","D":"Low prices can give some people more choice."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Sai: đoạn nói rõ <i>A shirt sold again is not harmless</i>.</li><li><b>B.</b> Đúng: reuse and repair keep value in motion.</li><li><b>C.</b> Đúng: fast trends turn yesterday’s style into tomorrow’s rubbish.</li><li><b>D.</b> Đúng: low prices matter for people who need choice.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phát biểu nào KHÔNG đúng theo đoạn 2?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>A trái trực tiếp câu văn.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>Vì câu hỏi hỏi NOT true nên A là đáp án.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. A resold shirt is presented as harmless once it receives a second life.</div>"},{"n":34,"section":6,"stem":"Question 34: Which of the following best summarises paragraph 2?","options":{"A":"Used clothing is mainly presented as a cheap answer to fast fashion, although it cannot solve landfill problems alone.","B":"Clothing reuse helps delay waste, but the paragraph gives little attention to affordability or buyer choice.","C":"Second hand markets cannot erase earlier impacts, but they may slow waste, extend value, and widen affordable choice.","D":"Fast fashion speeds up disposal, while repair is shown as more important than access to cheaper clothing."},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Quá hẹp ở giá rẻ và landfill.</li><li><b>B.</b> Sai vì đoạn có nhấn mạnh low prices/choice.</li><li><b>C.</b> Đúng: bao quát ba ý chính: slow waste, value in motion, low-price choice, đồng thời thừa nhận earlier impacts.</li><li><b>D.</b> Tạo so sánh ‘repair more important than affordability’ mà đoạn không đưa.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào tóm tắt tốt nhất đoạn 2?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn vừa nêu lợi ích reuse/repair vừa thừa nhận resold shirt ‘not harmless’ và vai trò của low prices.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C cân bằng đầy đủ các ý.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. Second hand markets cannot erase earlier impacts, but they may slow waste, extend value, and widen affordable choice.</div>"},{"n":35,"section":6,"stem":"Question 35: The phrase “that cheerful image” in paragraph 3 refers to ______.","options":{"A":"the excitement of finding a clever bargain","B":"the attractive display of used goods","C":"the visible work of repair workers","D":"the online picture of responsible thrifting"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> ‘clever find’ xuất hiện sau, không phải tiền đề trực tiếp.</li><li><b>B.</b> Không nói display vật lý.</li><li><b>C.</b> Repair workers nằm <i>behind</i> image nên không phải chính image.</li><li><b>D.</b> Đúng: social media hauls làm second hand buying trông xanh và hấp dẫn; đó là hình ảnh online vui vẻ được nhắc tới.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Cụm <i>that cheerful image</i> chỉ điều gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu ngay trước mô tả <b>Social media hauls</b> và hình ảnh tiêu dùng với ánh sáng mềm/green language.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D quy chiếu đúng hình ảnh online đó.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. the online picture of responsible thrifting</div>"},{"n":36,"section":6,"stem":"Question 36: What does paragraph 3 suggest about social media hauls?","options":{"A":"They explain the hidden labour that keeps second hand goods moving.","B":"They can make second hand buying resemble a stylish form of consumption.","C":"They show that shoppers now value repair more than new purchases.","D":"They prevent thrift shopping from becoming another hunt for novelty."},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Ngược lại, hidden labour nằm phía sau và bị che khuất.</li><li><b>B.</b> Đúng: hauls làm second hand buying trông như consumption với softer lighting và greener language.</li><li><b>C.</b> Không có bằng chứng shoppers value repair more.</li><li><b>D.</b> Trái bài: thrift shopping có thể trở thành hunt for novelty.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Đoạn 3 gợi ý gì về các video/bài đăng ‘haul’ trên mạng xã hội?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu trực tiếp: <i>Social media hauls sometimes make second hand buying look like consumption...</i></p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là paraphrase sát nhất.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. They can make second hand buying resemble a stylish form of consumption.</div>"},{"n":37,"section":6,"stem":"Question 37: The word “erased” in paragraph 4 is OPPOSITE in meaning to ______.","options":{"A":"removed","B":"wasted","C":"preserved","D":"damaged"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> <b>removed</b>: gần nghĩa erased.</li><li><b>B.</b> <b>wasted</b>: bị lãng phí, không đối nghĩa trực tiếp.</li><li><b>C.</b> <b>preserved</b>: được giữ gìn → đối nghĩa.</li><li><b>D.</b> <b>damaged</b>: bị hư hại.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>erased</i> TRÁI NGHĨA với từ nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu nói value is not erased by previous use = giá trị không bị xóa mất.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>Đối nghĩa là <b>preserved</b> = được giữ lại.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. preserved</div>"},{"n":38,"section":6,"stem":"Question 38: Which of the following best paraphrases the underlined sentence in paragraph 4?","options":{"A":"Reused goods gain deeper meaning when repair, fair sorting, and reduced buying support their second life.","B":"Old items become valuable mainly because they are cheap, repaired, and chosen by careful shoppers.","C":"Second hand markets are useful when they rescue damaged goods and make buying feel responsible.","D":"Reuse works best when people buy used goods often instead of thinking about new products."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: reuse + repair + fair sorting + less buying giúp old jacket trở thành hơn một món bargain.</li><li><b>B.</b> Thêm yếu tố cheap/careful shoppers và bỏ less buying/fair sorting.</li><li><b>C.</b> Không giữ đầy đủ điều kiện.</li><li><b>D.</b> Khuyến khích buy used goods often, trái ý less buying overall.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào diễn đạt lại tốt nhất câu gạch chân?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu gốc nhấn mạnh điều kiện kết hợp nhiều yếu tố để second life có ý nghĩa hơn.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A bảo toàn đầy đủ các yếu tố chính.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. Reused goods gain deeper meaning when repair, fair sorting, and reduced buying support their second life.</div>"},{"n":39,"section":6,"stem":"Question 39: Which of the following can be inferred from the passage?","options":{"A":"Second hand markets are mainly a short-lived fashion trend that will disappear when buyers lose interest.","B":"Low prices are useful enough to make fair sorting and repair unnecessary.","C":"Second hand shopping is automatically ethical whenever shoppers choose used items instead of new ones.","D":"Second hand markets are most meaningful when reuse is connected with repair, fair sorting, hidden labour, and reduced consumption."},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Không có cơ sở và trái lập luận ‘slower ownership’.</li><li><b>B.</b> Trái đoạn 4: repair/fair sorting rất quan trọng.</li><li><b>C.</b> Bài phản đối việc coi second hand tự động là ethical.</li><li><b>D.</b> Đúng: toàn bài nhấn mạnh reuse chỉ có ý nghĩa khi đi cùng repair, sorting, nhận diện hidden labour và less buying.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Có thể suy ra điều gì từ toàn bài?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Các đoạn 3–4 đặc biệt nhấn mạnh hidden labour và <i>reuse joined with repair, fair sorting, and less buying</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D tổng hợp đúng thông điệp toàn bài.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. Second hand markets are most meaningful when reuse is connected with repair, fair sorting, hidden labour, and reduced consumption.</div>"},{"n":40,"section":6,"stem":"Question 40: Which of the following is the best title for the passage?","options":{"A":"The Cheap Appeal of Second-Hand Shopping","B":"Second-Hand Markets and the Value of Slower Ownership","C":"Social Media Hauls and the Hidden Labour of Thrift Culture","D":"Old Clothes as a Perfect Solution to Fast Fashion"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Quá hẹp ở yếu tố giá rẻ.</li><li><b>B.</b> Đúng: bao quát second hand markets và ý trung tâm ‘slower sense of ownership’.</li><li><b>C.</b> Chỉ tập trung đoạn 3.</li><li><b>D.</b> Sai vì bài nói second hand không phải giải pháp hoàn hảo.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Tiêu đề nào phù hợp nhất cho bài?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn cuối gọi bài học là <i>a slower sense of ownership</i>, trong khi toàn bài bàn về second hand markets.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B bao quát toàn bộ và giữ thái độ cân bằng.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát bằng chứng trong bài, ưu tiên paraphrase đúng ý và tránh suy diễn quá mức.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. Second-Hand Markets and the Value of Slower Ownership</div>"}];
const SOURCES={"1":"\n<div class=\"paper-instruction\">Read the following advertisement and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 1 to 6.</div>\n<h2>Should Individuals or Governments Take More Responsibility?</h2>\n<h3>A Growing Concern</h3>\n<p>Plastic waste and air pollution now affect many communities. Because these problems have a serious impact <b>(1) ______</b> daily life, people disagree about who should act first. Some believe individuals should change their habits, while others think governments must do more.</p>\n<h3>Different Views, Shared Goals</h3>\n<p>Supporters of personal responsibility point to a campaign <b>(2) ______</b> by local students to reduce plastic use and recycle more often. They believe small daily choices can <b>(3) ______</b> plastic use when many people take part. Meanwhile, others argue that governments <b>(4) ______</b> invest more in sustainable public transport and introduce laws to reduce emissions. In addition, public campaigns can encourage the <b>(5) ______</b> of greener habits among citizens. <b>(6) ______</b> the experts agree that both individuals and governments need to work together. One side alone cannot avoid difficulties when trying to solve environmental problems.</p>\n","2":"\n<div class=\"paper-instruction\">Read the following leaflet and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 7 to 12.</div>\n<h2>E-Waste: The Hidden Environmental Crisis</h2>\n<p>Many households now replace electronic devices more often, creating more e-waste. Old phones and computers may release harmful chemicals unless they are sent to proper waste <b>(7) ______</b> facilities, where unsafe parts are removed.</p>\n<h3>What can communities do?</h3>\n<ul>\n<li>Recycling centres separate e-waste into groups, including old devices that can still be repaired and reused.</li>\n<li>Volunteers help <b>(8) ______</b> used devices before they are repaired, reused, or recycled.</li>\n<li><b>(9) ______</b>, large amounts of e-waste are still thrown away with household rubbish.</li>\n<li>Some people still treat broken electronics <b>(10) ______</b> ordinary household rubbish, although they may contain harmful chemicals.</li>\n</ul>\n<p>Reducing e-waste can save valuable materials, lower pollution, and support a circular economy. Without proper recycling, valuable metals may go to <b>(11) ______</b> instead of being recovered. When students are offered two ways to deal with old devices - repairing them or donating them - <b>(12) ______</b> choice can help reduce waste.</p>\n","4":"\n<div class=\"paper-instruction\">Read the following passage and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 18 to 22.</div>\n<p>In recent years, sustainable tourism has become more important because many destinations want to welcome visitors without damaging the natural world. Eco-friendly tours encourage travellers to use public transport, carry refillable bottles, and respect local people. However, questions remain about whether a trip is truly sustainable, or <b>(18) ______</b>.</p>\n<p>Tourism can create serious environmental problems when it is managed carelessly. Some beaches and mountain paths are crowded with visitors, <b>(19) ______</b>. Plastic cups, food wrappers, and disposable bags are often left behind. Transport to famous sites can also increase carbon emissions. If tour companies focus mainly on cheap prices and large numbers of visitors, <b>(20) ______</b>. In addition, natural resources may be overused when hotels use too much water and electricity during busy seasons.</p>\n<p>Still, the answer is not simply to stop travelling. Tourists can make better choices by taking buses, choosing eco-friendly accommodation, avoiding single-use plastics, and picking up litter when possible. These habits may seem small, but if they are practised by many visitors, public places <b>(21) ______</b>. Local authorities can also help by setting up clear rules and reminding visitors to protect public places. Therefore, reducing the impact of tourism requires thoughtful decisions from both businesses and travellers. When planned carefully, tourism can provide local people with a steady source of income, <b>(22) ______</b>.</p>\n","5":"\n<div class=\"paper-instruction\">Read the passage and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 23 to 30.</div>\n<h2>Noise Pollution in Modern Cities</h2>\n<p><b>1.</b> At six in the morning, the city is already awake. Buses <u><b>cough</b></u> at traffic lights, motorbikes squeeze through narrow streets, and construction workers begin before office windows are fully opened. For some people, this noise is simply the sound of progress. A shopkeeper may welcome the busy road because <u><b>it</b></u> brings customers. A student may feel safer on a street that is never completely silent. Yet beneath this daily energy, there is a pressure that many residents learn to carry without naming it.</p>\n<p><b>2.</b> Noise pollution is not always dramatic. It does not darken the sky or leave rubbish on the pavement, so it is easier to excuse. However, the World Health Organization warns that excessive environmental noise can affect sleep, concentration, hearing, and even heart health. The problem is especially unfair because people do not experience the city equally. Those living near main roads, airports, markets, or building sites may have little choice but to accept a soundtrack that follows them into meals, homework, and sleep.</p>\n<p><b>3.</b> Modern media and public talk often treat city noise as a minor complaint, something sensitive people should tolerate, while a neighbour’s sleepless night remains too ordinary to become public concern. This is misleading. When a person becomes irritable after a broken night, the issue is not only personal weakness. When children struggle to focus in a classroom beside heavy traffic, the problem is not simply discipline, but the noisy conditions adults have learned to excuse. <u><b>Not until noise is understood as a shared condition can a city stop blaming individuals for reactions created by its own design.</b></u></p>\n<p><b>4.</b> Still, silence should not be <u><b>romanticised</b></u>. A living city needs movement, voices, trade, and public life. The wiser question is not how to make cities mute, but how to make them kinder to the human body. Quieter transport, better building rules, more trees, and protected quiet areas can reduce harm without killing urban energy. A good city is not one without sound. It is one where sound does not become a form of invisible exhaustion.</p>\n<p class=\"source-note\">[Adapted from<br><u><b>https://www.who.int/tools/compendium-on-health-and-environment/environmental-noise</b></u>]</p>\n","6":"\n<div class=\"paper-instruction\">Read the passage and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 31 to 40.</div>\n<p><b>1.</b> On a Saturday morning, a teenager lifts a denim jacket and checks the sleeves. The price is low, but not the only pull. Someone else has softened the fabric, lost a button, chosen it, and let it go. Around her, shoes, scarves, and school bags wait in the open, <u><b>spared from the tidy ending</b></u> that shops usually give to old things. Here, buying can feel less like taking and more like listening.</p>\n<p><b>2.</b> Second hand markets matter because they slow the careless journey from purchase to waste. <b>[I]</b> In clothing, where fast trends turn yesterday’s style into tomorrow’s rubbish, reuse and repair keep value in motion. <b>[II]</b> A shirt sold again is not harmless, since it has been made, washed, transported, and priced. <b>[III]</b> Low prices also
